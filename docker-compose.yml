# The blind sync relay, and nothing else. The clients hold the data; this
# service only stores ciphertext it cannot read.
#
# Compose reads `.env` from this directory — copy `.env.example` to `.env` first.
services:
  sync:
    build:
      # The build context is the repository root because the server consumes
      # @giraffle/protocol through a relative file: dependency.
      context: .
      dockerfile: apps/server/Dockerfile
    image: giraffle-sync
    container_name: giraffle-sync
    restart: unless-stopped
    ports:
      - "${SYNC_PORT:-8787}:8787"
    environment:
      SYNC_TOKENS: ${SYNC_TOKENS:?set SYNC_TOKENS in .env as vaultId:token}
      DATABASE_PATH: /data/giraffle-sync.db
    volumes:
      - giraffle_sync_data:/data

volumes:
  giraffle_sync_data:
