services:
  postgres:
    image: postgres:16-alpine
    container_name: giraffle-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: giraffle
      POSTGRES_PASSWORD: giraffle_dev_2024
      POSTGRES_DB: giraffle
    volumes:
      - giraffle_pgdata:/var/lib/postgresql/data

volumes:
  giraffle_pgdata:
