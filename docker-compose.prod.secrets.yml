services:
  app:
    secrets:
      - source: auth_secret
        target: auth_secret
    environment:
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      NEXTAUTH_SECRET_FILE: /run/secrets/auth_secret

secrets:
  auth_secret:
    file: ${AUTH_SECRET_FILE:?AUTH_SECRET_FILE is required when using docker-compose.prod.secrets.yml}
