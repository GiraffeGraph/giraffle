name: CI / CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  NEXT_TELEMETRY_DISABLED: "1"
  CI_AUTH_SECRET: ci-placeholder-secret-32-characters-minimum
  CI_DATABASE_URL: postgresql://giraffle:giraffle@localhost:5432/giraffle?schema=public

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'next.config.ts', 'tsconfig.json', 'eslint.config.mjs', 'prisma/schema.prisma') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ${{ env.CI_AUTH_SECRET }}
          NEXTAUTH_SECRET: ${{ env.CI_AUTH_SECRET }}
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          OPENAI_API_KEY: ci-placeholder-openai-key
          FEED_REFRESH_SECRET: ci-placeholder-feed-secret

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

  smoke:
    name: Production stack smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create smoke environment file
        run: |
          cat > .env.ci.production <<'EOF'
          APP_IMAGE=giraffle:ci
          APP_PORT=3000
          POSTGRES_USER=giraffle
          POSTGRES_PASSWORD=giraffle_ci_password
          POSTGRES_DB=giraffle
          DATABASE_URL=postgresql://giraffle:giraffle_ci_password@postgres:5432/giraffle?connection_limit=3&pool_timeout=10
          NEXTAUTH_URL=http://localhost:3000
          AUTH_SECRET=ci-placeholder-secret-32-characters-minimum
          FEED_REFRESH_SECRET=ci-placeholder-feed-secret
          NODE_ENV=production
          EOF

      - name: Boot production compose stack and verify health
        run: sh ./scripts/smoke-prod-stack.sh
        env:
          ENV_FILE: ${{ github.workspace }}/.env.ci.production
          COMPOSE_PROJECT_NAME: giraffle-ci-${{ github.run_id }}-${{ github.run_attempt }}

  publish:
    name: Publish Docker image
    needs: [quality, smoke]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
