name: PR check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # prisma.config.ts reads env("DATABASE_URL"); postinstall `prisma generate`
    # and `prisma validate` need it set or they throw PrismaConfigEnvError.
    # A dummy URL is enough — these steps only parse the URL, never connect.
    env:
      DATABASE_URL: postgresql://giraffle:giraffle@localhost:5432/giraffle?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm

      - name: Install
        run: npm ci
        env:
          PRISMA_HIDE_UPDATE_MESSAGE: "1"

      - name: Prisma validate
        run: npm run prisma:validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Dependency audit
        run: npm run audit

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
