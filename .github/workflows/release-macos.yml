name: Release macOS desktop and CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/app/package-lock.json
            apps/cli/package-lock.json

      - name: Verify tag and package versions
        run: node scripts/verify-release-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix apps/cli
          npm ci --prefix apps/app

      - name: Verify
        run: |
          npm run verify
          npm --prefix apps/app run lint
          npm --prefix apps/app run typecheck
          npm --prefix apps/app test

      - name: Import Developer ID certificate
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$MAC_CERTIFICATE"
          CERTIFICATE_PATH="$RUNNER_TEMP/giraffle.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/giraffle.keychain-db"
          echo "$MAC_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MAC_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build, sign and notarize desktop
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm --prefix apps/app run desktop:mac:signed

      - name: Verify macOS artifact
        run: |
          APP="apps/app/release/macos/mac-universal/Giraffle.app"
          DMG="apps/app/release/macos/Giraffle-${GITHUB_REF_NAME#v}-macOS-universal.dmg"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          test -f "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="apps/app/release/macos/Giraffle-${GITHUB_REF_NAME#v}-macOS-universal.dmg"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$DMG" "$DMG.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$DMG" "$DMG.sha256" --verify-tag --generate-notes --title "Giraffle $GITHUB_REF_NAME"
          fi

      - name: Publish CLI to npm
        working-directory: apps/cli
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
