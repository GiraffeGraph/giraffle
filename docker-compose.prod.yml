services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-giraffle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-giraffle}
    volumes:
      - giraffle_pgdata:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=20
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=384MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=8MB
      -c log_min_duration_statement=2000
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-giraffle} -d ${POSTGRES_DB:-giraffle}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: ${APP_IMAGE:-giraffle:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_DISABLE_SECURE_COOKIES: ${AUTH_DISABLE_SECURE_COOKIES:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NODE_OPTIONS: "--max-old-space-size=512"
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
    command: ["sh", "./scripts/container-start.sh"]
    volumes:
      - giraffle_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 768m
    cpus: 1.00

volumes:
  giraffle_pgdata:
  giraffle_uploads:
